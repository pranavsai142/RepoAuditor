[project]
name = "repoauditor"
version = "0.1.0"
description = "Department-scale forensic audit of local git repositories"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
repoauditor = "repoauditor.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repoauditor = ["bots_default.json", "assistants.json", "auditor/checklist.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
